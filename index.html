<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLANCON Animais — Defesa Civil RJ</title>
<style>
  :root{
    --blue-900:#0b2545;
    --blue-800:#0f2f57;
    --blue-700:#16406f;
    --blue-600:#1c5490;
    --blue-100:#e8eff8;
    --orange-600:#d9530a;
    --orange-500:#f2760c;
    --orange-100:#fdece0;
    --gray-50:#f7f8fa;
    --gray-100:#eef0f3;
    --gray-200:#e1e5eb;
    --gray-400:#9aa4b2;
    --gray-600:#5b6572;
    --gray-800:#2b323c;
    --white:#ffffff;
    --lvl0:#4c7a5e;
    --lvl0-bg:#e7f1eb;
    --lvl1:#b8860a;
    --lvl1-bg:#fbf1d9;
    --lvl2:#d9530a;
    --lvl2-bg:#fdece0;
    --lvl3:#b8271f;
    --lvl3-bg:#faeae9;
    --radius:14px;
    --shadow: 0 1px 2px rgba(11,37,69,.06), 0 6px 20px rgba(11,37,69,.08);
    --shadow-hover: 0 2px 4px rgba(11,37,69,.08), 0 12px 28px rgba(11,37,69,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  svg{ fill:none; stroke:currentColor; }
  body{
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    min-height:100vh;
  }
  .topbar{
    background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
    color: var(--white);
    padding: 18px 24px;
    display:flex;
    align-items:center;
    gap:14px;
    position: sticky;
    top:0;
    z-index: 20;
    box-shadow: 0 2px 10px rgba(11,37,69,.25);
  }
  .topbar .badge{
    width:44px;height:44px;border-radius:50%;
    background: var(--orange-500);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
  }
  .topbar .badge svg{width:24px;height:24px;stroke:white;fill:none;}
  .topbar-text .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--orange-100); opacity:.9; font-weight:600;
  }
  .topbar-text h1{
    font-size:16px; margin:2px 0 0; font-weight:700; letter-spacing:.01em;
  }
  .breadcrumb{
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 24px 0;
    font-size:13px;
    color: var(--gray-600);
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
  }
  .breadcrumb .crumb{cursor:pointer; color:var(--blue-600);}
  .breadcrumb .crumb:hover{text-decoration:underline;}
  .breadcrumb .crumb.current{color:var(--gray-800); font-weight:600; cursor:default;}
  .breadcrumb .crumb.current:hover{text-decoration:none;}
  .breadcrumb .sep{color:var(--gray-400);}

  .backbar{
    max-width: 980px;
    margin: 10px auto 0;
    padding: 0 24px;
  }
  .backbtn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    color: var(--blue-700);
    font-weight:600;
    font-size:13.5px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
  }
  .backbtn:hover{ background: var(--blue-100); border-color:var(--blue-600); }
  .backbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;}
  .backbtn:disabled{opacity:0; pointer-events:none;}

  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 18px 24px 64px;
  }
  .screen{ display:none; animation: fadein .25s ease; }
  .screen.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .hero{
    text-align:center;
    padding: 28px 10px 8px;
  }
  .hero .kicker{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--orange-100); color: var(--orange-600);
    font-weight:700; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:999px; margin-bottom:16px;
  }
  .hero .kicker svg{ width:14px;height:14px; stroke:currentColor; flex-shrink:0; }
  .hero h2{
    font-size: 26px; color: var(--blue-900); margin: 0 0 8px; font-weight:800;
    letter-spacing:-0.01em;
  }
  .hero p.sub{
    color: var(--gray-600); font-size:15px; max-width:560px; margin: 0 auto;
    line-height:1.55;
  }

  .section-title{
    font-size: 20px; color: var(--blue-900); font-weight:800; margin: 4px 0 4px;
  }
  .section-desc{ color: var(--gray-600); font-size:14.5px; line-height:1.6; margin: 0 0 22px; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
    gap:16px; margin-top: 18px;
  }
  .grid.tight{ grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); }

  .card{
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 20px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:10px;
    text-align:left;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--blue-600); }
  .card .icon{
    width:42px;height:42px;border-radius:11px;
    background: var(--blue-100); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
  }
  .card .icon svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .card.orange .icon{ background: var(--orange-100); color: var(--orange-600); }
  .card h3{ margin:0; font-size:15.5px; color:var(--blue-900); font-weight:700; line-height:1.35; }
  .card p{ margin:0; font-size:13px; color:var(--gray-600); line-height:1.5; }
  .card .go{
    margin-top:auto; display:flex; align-items:center; gap:5px;
    color: var(--blue-600); font-size:12.5px; font-weight:700;
  }
  .card .go svg{width:12px;height:12px;stroke:currentColor;fill:none;}

  .home-card{ padding:26px 20px; }
  .home-card .icon{ width:52px;height:52px;border-radius:13px; }
  .home-card .icon svg{width:26px;height:26px;}
  .home-card h3{ font-size:16.5px; }

  /* level badge cards */
  .lvl-card{ border-left: 6px solid var(--gray-400); }
  .lvl-card[data-lvl="0"]{ border-left-color: var(--lvl0); }
  .lvl-card[data-lvl="1"]{ border-left-color: var(--lvl1); }
  .lvl-card[data-lvl="2"]{ border-left-color: var(--lvl2); }
  .lvl-card[data-lvl="3"]{ border-left-color: var(--lvl3); }
  .lvl-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:800; letter-spacing:.04em;
    padding:4px 10px; border-radius:999px; width:fit-content;
  }
  .lvl-pill[data-lvl="0"]{ background:var(--lvl0-bg); color:var(--lvl0); }
  .lvl-pill[data-lvl="1"]{ background:var(--lvl1-bg); color:var(--lvl1); }
  .lvl-pill[data-lvl="2"]{ background:var(--lvl2-bg); color:var(--lvl2); }
  .lvl-pill[data-lvl="3"]{ background:var(--lvl3-bg); color:var(--lvl3); }

  .lvl-banner{
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom:22px;
    display:flex; flex-direction:column; gap:8px;
  }
  .lvl-banner[data-lvl="0"]{ background:var(--lvl0-bg); }
  .lvl-banner[data-lvl="1"]{ background:var(--lvl1-bg); }
  .lvl-banner[data-lvl="2"]{ background:var(--lvl2-bg); }
  .lvl-banner[data-lvl="3"]{ background:var(--lvl3-bg); }
  .lvl-banner h3{ margin:0; font-size:17px; font-weight:800; }
  .lvl-banner[data-lvl="0"] h3{ color:var(--lvl0); }
  .lvl-banner[data-lvl="1"] h3{ color:var(--lvl1); }
  .lvl-banner[data-lvl="2"] h3{ color:var(--lvl2); }
  .lvl-banner[data-lvl="3"] h3{ color:var(--lvl3); }
  .lvl-banner p{ margin:0; font-size:14px; color:var(--gray-800); line-height:1.55; }

  .panel{
    background: var(--white);
    border:1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .panel h4{
    margin: 0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em;
    color: var(--blue-700); font-weight:800;
  }
  .panel p{ font-size:14.5px; line-height:1.65; color: var(--gray-800); margin:0 0 10px; }
  ul.bullets{ margin:0; padding-left: 20px; }
  ul.bullets li{ font-size:14.5px; line-height:1.65; color: var(--gray-800); margin-bottom:8px; }
  ul.bullets li::marker{ color: var(--orange-600); }
  ol.steps{ margin:0; padding-left: 22px; }
  ol.steps li{ font-size:14.5px; line-height:1.65; color: var(--gray-800); margin-bottom:10px; }
  ol.steps li::marker{ color: var(--blue-600); font-weight:700; }

  .flow{
    display:flex; flex-direction:column; gap:0;
  }
  .flow-step{
    display:flex; align-items:flex-start; gap:14px;
  }
  .flow-num{
    width:30px;height:30px;border-radius:50%;
    background: var(--blue-700); color:white; font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .flow-line{
    width:2px; flex:1; background: var(--gray-200); margin: 4px 0 4px 14px;
    min-height:22px;
  }
  .flow-body{ padding-bottom: 18px; padding-top:2px; }
  .flow-body p{ margin:0; font-size:14.5px; color:var(--gray-800); line-height:1.5; font-weight:600; }

  footer{
    text-align:center; color: var(--gray-400); font-size:12px; padding: 20px 24px 40px;
  }

  .chiplist{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap:10px;
  }
  .chip{
    display:flex; align-items:flex-start; gap:10px;
    background: var(--gray-50); border:1px solid var(--gray-200);
    border-radius:10px; padding:11px 13px;
  }
  .chip .chip-badge{
    width:22px;height:22px;border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
    font-size:11px; line-height:1; font-weight:800; color:white; background: var(--blue-700);
  }
  .chip-badge.check{ background: var(--orange-500); }
  .chip-badge svg{ width:12px;height:12px; stroke:white; }
  .chip .chip-label{ font-size:13.5px; line-height:1.45; color: var(--gray-800); }

  /* ---------- Barra institucional (co-marca) ---------- */
  .institutional-bar{
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 9px 24px;
  }
  .institutional-bar .inner{
    max-width: 980px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .institutional-bar .gov-id{
    display:flex; align-items:center; gap:7px;
    color: var(--gray-600); font-size:11.5px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;
  }
  .institutional-bar .gov-id svg{ width:15px;height:15px; stroke:var(--blue-700); flex-shrink:0; }
  .institutional-bar .gov-id .full{ font-weight:500; color:var(--gray-400); }
  .institutional-bar .committee-logo{ height:24px; width:auto; display:block; flex-shrink:0; }

  /* ---------- Selo do Comitê na tela inicial ---------- */
  .hero .seal{
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--white); border:1px solid var(--gray-200); border-radius:14px;
    padding:12px 20px; margin: 0 0 18px; box-shadow: var(--shadow);
  }
  .hero .seal img{ height:32px; width:auto; display:block; }

  .hero-cta{ margin-top:24px; }

  .stats-row{
    display:flex; justify-content:center; gap:32px; margin-top:24px; flex-wrap:wrap;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:1px; min-width:64px; }
  .stat strong{ font-size:22px; color:var(--blue-900); font-weight:800; line-height:1.2; }
  .stat span{ font-size:11px; color:var(--gray-600); text-transform:uppercase; letter-spacing:.03em; font-weight:600; text-align:center; }

  /* ---------- Responsividade ---------- */
  @media (max-width:760px){
    .grid{ grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); }
    .grid.tight{ grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); }
  }

  @media (max-width:640px){
    .institutional-bar{ padding:7px 16px; }
    .institutional-bar .gov-id{ font-size:10px; gap:5px; }
    .institutional-bar .gov-id svg{ width:13px;height:13px; }
    .institutional-bar .committee-logo{ height:19px; }

    .topbar{ padding:14px 16px; gap:10px; }
    .topbar .badge{ width:38px;height:38px; }
    .topbar .badge svg{ width:19px;height:19px; }
    .topbar-text .eyebrow{ font-size:10px; }
    .topbar-text h1{ font-size:13.5px; }

    .breadcrumb{ padding:12px 16px 0; font-size:12px; }
    .backbar{ padding:0 16px; margin-top:8px; }
    main{ padding:16px 16px 48px; }

    .hero{ padding:22px 2px 4px; }
    .hero h2{ font-size:22px; }
    .hero p.sub{ font-size:14px; }
    .hero .seal{ padding:9px 16px; margin-bottom:14px; }
    .hero .seal img{ height:26px; }
    .stats-row{ gap:20px; margin-top:20px; }
    .stat strong{ font-size:19px; }
    .stat span{ font-size:10px; }

    .section-title{ font-size:18px; }
    .panel{ padding:16px 16px; }
    .card{ padding:16px; }
    .home-card{ padding:20px 16px; }
    .grid{ gap:12px; }
    .grid.tight{ gap:12px; }

    .chiplist{ grid-template-columns: 1fr; }
  }

  @media (max-width:380px){
    .institutional-bar .gov-id .full{ display:none; }
    .hero h2{ font-size:20px; }
    .stats-row{ gap:14px; }
  }
</style>
</head>
<body>

<div class="institutional-bar">
  <div class="inner">
    <div class="gov-id">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3z"/></svg>
      Defesa Civil<span class="full"> · Governo do Estado do Rio de Janeiro</span>
    </div>
    <img id="institLogo" class="committee-logo" alt="Comitê Estadual de Enfrentamento aos Efeitos do El Niño">
  </div>
</div>

<div class="topbar">
  <div class="badge">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3z"/><path d="M9 12l2 2 4-4"/></svg>
  </div>
  <div class="topbar-text">
    <div class="eyebrow">PLANCON Estadual · Componente Animal</div>
    <h1>Plano de Contingência para Animais — Resumo Prático</h1>
  </div>
</div>

<div class="breadcrumb" id="breadcrumb"></div>
<div class="backbar"><button class="backbtn" id="backBtn" onclick="goBack()">
  <svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  voltar
</button></div>

<main id="main"></main>

<footer>PLANCON Animais RJ · versão preliminar em desenvolvimento</footer>

<script>
/* ---------- Ícones ---------- */
const ICONS = {
  home: `<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>`,
  scenario: `<path d="M4 19h16"/><path d="M6 19V9l4-4 4 4v10"/><path d="M14 19v-6l4-3 2 2v7"/>`,
  mobil: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>`,
  org: `<rect x="4" y="10" width="16" height="10" rx="1"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>`,
  chevron: `<path d="M9 6l6 6-6 6"/>`,
  flood: `<path d="M3 16c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/><path d="M12 3v9"/><path d="M8.5 8.5 12 12l3.5-3.5"/>`,
  alert: `<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/>`,
  flow: `<circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h6a4 4 0 0 1 4 4v4"/>`,
  levels: `<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20v-3"/>`,
  shield: `<path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3z"/>`,
  mountain: `<path d="M3 20 9 8l4 7 3-4 5 9z"/><path d="M11.5 13.5 9.5 16.5"/>`,
  clipboard: `<rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 10h6"/><path d="M9 14h6"/><path d="M9 18h3"/>`,
  layers: `<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>`,
  cross: `<path d="M12 3v18M3 12h18"/>`,
  paw: `<circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="5.5" r="1.8"/><circle cx="17" cy="8" r="1.8"/><ellipse cx="12" cy="15" rx="5" ry="4"/>`,
  leaf: `<path d="M5 21c0-9 5-16 15-16-1 10-6 15-15 16z"/><path d="M9.5 15.5 18 7"/>`,
  city: `<rect x="3" y="10" width="6" height="11"/><rect x="11" y="4" width="10" height="17"/><path d="M14 8h2M14 12h2M14 16h2"/>`,
  check: `<path d="M5 12.5 10 17 19 7"/>`,
};

/* ---------- Motor de telas (replica a lógica "1 aba = 1 tela" da planilha) ---------- */
let stack = ["home"];

function bullets(arr){ return `<ul class="bullets">${arr.map(t=>`<li>${t}</li>`).join('')}</ul>`; }

function chipList(items, opts={}){
  const numbered = !!opts.numbered;
  return `<div class="chiplist">${items.map((raw,i)=>{
    const label = raw.replace(/^\d+\.\s*/,'').replace(/[;.]\s*$/,'');
    const badge = numbered ? `<span class="chip-badge">${i+1}</span>` : `<span class="chip-badge check">${icon('check')}</span>`;
    return `<div class="chip">${badge}<span class="chip-label">${label}</span></div>`;
  }).join('')}</div>`;
}

/* ---------- Navegação ---------- */
function nav(id){
  stack.push(id);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBack(){
  if(stack.length > 1){
    stack.pop();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function goTo(index){
  stack = stack.slice(0, index+1);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function render(){
  const current = stack[stack.length-1];
  document.getElementById('main').innerHTML = `<div class="screen active">${SCREENS[current].render()}</div>`;
  document.getElementById('backBtn').disabled = stack.length <= 1;
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = stack.map((id,i)=>{
    const last = i === stack.length-1;
    return `${i>0?'<span class="sep">/</span>':''}<span class="crumb ${last?'current':''}" ${last?'':`onclick="goTo(${i})"`}>${SCREENS[id].crumb}</span>`;
  }).join('');
}
render();
